name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with:
          hugo-version: "0.159.0"
          extended: true

      - name: Build sample site
        shell: bash
        run: |
          set -euo pipefail
          SITE_DIR="${RUNNER_TEMP}/site"
          OUT_DIR="${RUNNER_TEMP}/public"
          mkdir -p "${SITE_DIR}/content" "${SITE_DIR}/assets/renderers" "${SITE_DIR}/layouts/_default" "${SITE_DIR}/_modules"
          ln -s "${GITHUB_WORKSPACE}" "${SITE_DIR}/_modules/hugo-mod-echarts"

          cat > "${SITE_DIR}/layouts/_default/single.html" <<'EOF'
          <!DOCTYPE html>
          <html><body>{{ .Content }}</body></html>
          EOF

          cat > "${SITE_DIR}/layouts/_default/list.html" <<'EOF'
          <!DOCTYPE html>
          <html><body>{{ .Content }}</body></html>
          EOF

          cat > "${SITE_DIR}/hugo.toml" <<'EOF'
          baseURL = "https://example.org/"
          [module]
            [[module.mounts]]
              source = "content"
              target = "content"
            [[module.mounts]]
              source = "assets"
              target = "assets"
            [[module.mounts]]
              source = "layouts"
              target = "layouts"
            [[module.mounts]]
              source = "_modules/hugo-mod-echarts/layouts"
              target = "layouts"
            [[module.mounts]]
              source = "_modules/hugo-mod-echarts/assets"
              target = "assets"
          EOF

          cat > "${SITE_DIR}/assets/renderers/echarts.json" <<'EOF'
          {
            "xAxis": { "type": "category", "data": ["Mon", "Tue", "Wed"] },
            "yAxis": { "type": "value" },
            "series": [{ "type": "bar", "data": [12, 20, 15] }]
          }
          EOF

          B64_SOURCE=$(printf '{"series":[{"type":"pie","data":[1,2]}]}' | base64 -w0)

          cat > "${SITE_DIR}/content/test.md" <<EOF
          ---
          title: "ECharts test"
          ---

          {{< echarts height="320px" src="renderers/echarts.json" />}}

          {{< echarts theme="dark" renderer="svg" >}}
          {
            "title": { "text": "Ventes - région Été" },
            "series": [{ "type": "line", "data": [3, 1, 4] }]
          }
          {{< /echarts >}}

          {{< echarts b64="${B64_SOURCE}" />}}
          EOF

          hugo --source "${SITE_DIR}" --destination "${OUT_DIR}"
          PAGE="${OUT_DIR}/test/index.html"

          # Assets are fingerprinted (cache-busting) and injected only once
          # for the whole page.
          grep -oE 'libs/hugo-mod-echarts/hugo-mod-echarts\.[0-9a-f]+\.js' "${PAGE}"
          test "$(grep -oE 'libs/hugo-mod-echarts/hugo-mod-echarts\.[0-9a-f]+\.js' "${PAGE}" | wc -l)" -eq 1

          # Every injected asset ships a matching Subresource Integrity hash.
          test "$(grep -c 'integrity="sha256-' "${PAGE}")" -eq 3

          # The fingerprinted files are actually published at that path.
          JS_PATH=$(grep -oE 'libs/hugo-mod-echarts/hugo-mod-echarts\.[0-9a-f]+\.js' "${PAGE}" | head -1)
          test -f "${OUT_DIR}/${JS_PATH}"

          # All three input modes produce a wrapper.
          test "$(grep -c 'data-hugo-mod-echarts' "${PAGE}")" -eq 3

          # theme and renderer params are forwarded as data attributes.
          grep -q 'data-theme="dark" data-renderer="svg"' "${PAGE}"

          # echarts-gl is not loaded unless a shortcode opts in with gl="true".
          if grep -qE 'echarts-gl\.min\.[0-9a-f]+\.js' "${PAGE}"; then
            echo "echarts-gl must not load without gl=true" >&2
            exit 1
          fi

          # Inline UTF-8 source survives the base64 round-trip untouched.
          # Hugo escapes "+" as "&#43;" in attributes; browsers unescape it,
          # so the assertion must do the same before decoding.
          grep -o 'data-source="[^"]*"' "${PAGE}" | sed -n '2p' \
            | sed 's/data-source="//;s/"$//;s/&#43;/+/g' | base64 -d \
            | grep -q "Ventes - région Été"

          # gl="true" loads echarts-gl exactly once, deduped page-wide.
          cat > "${SITE_DIR}/content/gl.md" <<'EOF'
          ---
          title: "ECharts GL test"
          ---

          {{< echarts gl="true" >}}
          {"series":[{"type":"scatter3D","data":[[1,2,3]]}]}
          {{< /echarts >}}

          {{< echarts gl="true" >}}
          {"series":[{"type":"bar3D","data":[[1,2,3]]}]}
          {{< /echarts >}}
          EOF
          hugo --source "${SITE_DIR}" --destination "${OUT_DIR}"
          test "$(grep -oE 'echarts-gl\.min\.[0-9a-f]+\.js' "${OUT_DIR}/gl/index.html" | wc -l)" -eq 1

          # An empty source must fail the build explicitly.
          cat > "${SITE_DIR}/content/invalid.md" <<'EOF'
          ---
          title: "invalid"
          ---

          {{< echarts >}}
          {{< /echarts >}}
          EOF
          if hugo --source "${SITE_DIR}" --destination "${RUNNER_TEMP}/public-invalid"; then
            echo "expected the build to fail on an empty shortcode source" >&2
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"

      - name: Install test dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Verify real rendering in a headless browser
        run: node tests/verify-render.js "${RUNNER_TEMP}/public" "test/"
